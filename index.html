<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Senéhorario se mudó</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://senehorario.cmolina.xyz/" />
    <script>
      // Senéhorario moved to senehorario.cmolina.xyz. Send visitors to the same
      // page there, carrying their saved session and plans in the URL fragment
      // (localStorage doesn't cross origins; the fragment never reaches a server).
      (function () {
        var target = "https://senehorario.cmolina.xyz";
        var path = location.pathname
          .replace(/^\/senehorario/, "")
          .replace(/\/index\.html$/, "")
          .replace(/\/+$/, "");
        target += path === "" || path === "/landing" ? "/" : path;
        target += location.search;
        try {
          var data = {};
          var state = localStorage.getItem("planningState");
          var plans = localStorage.getItem("savedPlans");
          if (state) {
            data.planningState = JSON.parse(state);
            delete data.planningState.scheduleOptions; // regenerated by the new app
          }
          if (plans) {
            data.savedPlans = JSON.parse(plans);
            for (var name in data.savedPlans) {
              if (data.savedPlans[name]) delete data.savedPlans[name].scheduleOptions;
            }
          }
          if (data.planningState || data.savedPlans) {
            target += "#import=" + encodeURIComponent(JSON.stringify(data));
          }
        } catch (e) {}
        location.replace(target);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://senehorario.cmolina.xyz/" /></noscript>
  </head>
  <body style="font-family: system-ui, sans-serif; padding: 2rem">
    <p>
      Senéhorario ahora vive en
      <a href="https://senehorario.cmolina.xyz/">senehorario.cmolina.xyz</a>.
    </p>
  </body>
</html>
